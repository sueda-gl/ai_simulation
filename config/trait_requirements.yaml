# Trait requirements for each decision module
# This file specifies which columns from the merged survey+experiment data
# each decision needs. The TraitEngine will eventually fit a copula only on
# the union of all specified traits instead of all ~50+ survey columns.

donation_default:
  # Decision 3: Set up default donation rate
  # Uses anchor formula: 0.75 * observed_prosocial + 0.25 * predicted_prosocial
  # Predicted prosocial comes from regression on these traits:
  - Honesty_Humility                        # continuous variable (hh in regression)
  - Assigned Allowance Level                # allocated income variable from experiment
  - Study Program                           # study program indicator
  - Group_experiment                        # experimental group indicator (use experiment version)
  - TWT+Sospeso [=AW2+AX2]{Periods 1+2}    # experimental prosocial score for 75% anchor weight

# Placeholder blocks for remaining decisions - traits TBD when models are fitted
disclose_income:
  # Decision 1: Disclose income for Fixed status
  # Two-stage mediation model: Prosocial Behavior → Disclose Income
  # Equation 1 (PB): Agreeable, Openness, Honesty_Humility, Religiosity
  # Equation 2 (DI): Extraversion, Neuroticism, Honesty_Humility, Income, PB*income_high
  - Agreeable
  - OpennessBig5
  - Honesty_Humility
  - ExtraversionBig5
  - NeuroticismBig5
  - ReligiousAffiliation
  - ReligiousService
  - Assigned Allowance Level
  - TWT+Sospeso [=AW2+AX2]{Periods 1+2}

disclose_documents:
  # Decision 2: Disclose documents (Privacy-Calculus model: Bansal 2016 + Dinev & Hart 2006)
  # Traits: Extraversion, Neuroticism, Agreeableness (z-scored).
  # Income/allowance handled via Assigned Allowance Level (categorical) or the generated
  # `income` (continuous). NOTE: Total Allowance is DERIVED from Assigned Allowance Level
  # (not sampled), and the stochastic sigma is a fixed config constant (not a per-agent
  # trait) - so no extra copula columns are required. See notes.md.
  - ExtraversionBig5
  - NeuroticismBig5
  - Agreeable
  - Assigned Allowance Level

rejected_transaction_defaults:
  # Decision 4: Rejected Transaction Defaults - five trait-based mechanisms
  # (TTP length, Loyalty / WTP / Risk-Taking / Cognitive Flexibility rankings).
  # Traits per the design doc: Big 5 z-scores + Education (reducation = Education - 1)
  # + continuous income (runtime-generated from Assigned Allowance Level, like the
  # disclose_* decisions) + stdactions (observed SD in the number of actions per
  # cycle over the eight experiment cycle-weeks; 25% anchor of the Cognitive
  # Flexibility score, doc Section 5; sourced from the professor's Stata file via
  # data/stata_stdactions.csv because the experiment workbook has no per-cycle counts).
  # NOTE: adding a trait requires retraining the copula (scripts/train_copula.py) -
  # synthetic populations change for ALL decisions (ConscientiousnessBig5/Education
  # added 2026-08; stdactions added 2026-09-04, previous model backed up as
  # config/trait_model.pkl.pre_flexibility.bak).
  - ExtraversionBig5
  - Agreeable
  - NeuroticismBig5
  - ConscientiousnessBig5
  - OpennessBig5
  - Education
  - Assigned Allowance Level
  - stdactions

vendor_choice_weights:
