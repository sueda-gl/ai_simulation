bid_value:
  uses_global_parameters:
  - market_price
  - platform_markup
  - price_range
  placeholder: false
  output_field: bid_value
  formula:
    baseline_price: "(1 + platform_markup) \xD7 market_price"
    min_bid: "(1 - price_range) \xD7 baseline_price"
    max_bid: "(1 + price_range) \xD7 baseline_price"
  distribution: uniform
  description: Random bid amount selected uniformly from calculated bidding range
    [min_bid, max_bid]
