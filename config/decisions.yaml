# Decision 4: Rejected Transaction Defaults - FIVE trait-based sub-decision mechanisms
# (TTP list length 0-5; Loyalty / WTP / Risk-Taking / Cognitive Flexibility priority
# rankings), integrated into ONE default list per agent by the Section-6 rank aggregation
# (doc rev 280826-2): Kemeny-Young consensus + tie-break hierarchy Schulze -> Copeland ->
# footrule -> random, then truncated to the TTP list length and at Option 5 (see
# `aggregation` below).
# Source: "Decision 4 - Rejected Transaction Defaults" doc (rev 280826-2); ground truth
# arbiter: Stata_File_Decision4_290826.dta (data/stata_d4_verification.csv is the frozen
# extract of all mechanisms incl. Flexibility, plus the June file's WTP stochastic columns;
# data/stata_d4_flexibility_verification.csv holds the Flexibility columns alone). All
# deterministic outputs (segments AND choice columns, Stata direction) verified 280/280.
rejected_transaction_defaults:
  uses_global_parameters: []
  placeholder: false
  output_field: rejected_transaction_defaults
  default_value: NA
  # Section-6 rank aggregation of the four ranking mechanisms into the integrated default
  # list (src/decisions/rtd_rank_aggregation.py). Equal weights (doc). `mechanisms` null =
  # every ranking mechanism the model computes (loyalty, wtp, risk_taking, flexibility).
  # last_resort: 'random' (doc) breaks the ties no criterion can separate at random
  # (the only rule exposed in the app).
  aggregation:
    enabled: true
    mechanisms: null
    last_resort: random
  # Cognitive Flexibility anchoring (doc Section 5): anchored_flexibility =
  # observed_weight * z_stdactions + calculated_weight * z_Flexibility_calculated_ivw
  # ("we start by giving the observed flexibility a weight of 25%"; .dta-verified 0.25/0.75).
  flexibility_anchor:
    observed_weight: 0.25
    calculated_weight: 0.75
  coefficients:
    ttp:                       # Tendency to Plan -> number of pre-selected options (0-5)
      extraversion: -0.0152556564
      agreeable: 0.0177638642
      neuroticism: 0.01959
      conscientiousness: 0.00901465
      education: 0.0297        # applies to reducation = Education - 1 (0/1)
    loyalty:                   # doc rev 280826-2 bs_weighted_loyalty; priority 3 > 1 > 4 > 5 > 2
      extraversion: -0.009828468   # (.dta 290826: bs reproduces to 7e-9; std(bs) is binned)
      openness: 0.01096706
      agreeable: 0.03092465
    wtp:                       # Hunter & Schmidt pooling (doc code); priority 3 > 2 > 1 > 4 > 5
      extraversion: 0.078863062
      agreeable: -0.012326128
      income: 0.698
    risk_taking:               # Hunter & Schmidt pooling; priority 4 > 2 > 1 > 3 > 5
      extraversion: 0.025942386297
      openness: 0.023699214948
      agreeable: -0.038734315188
      conscientiousness: -0.037739440732
      neuroticism: -0.025388697852
      income: 0.006874197106
    flexibility:               # IVW pooling (retained, doc Section 5); priority 2 > 4 > 3 > 1 > 5
      extraversion: 0.0206     # doc/.dta literal values (audit: O/N/A weights inconsistent
      openness: 0.0293241      # with their own inputs - flagged to the professor, not changed)
      neuroticism: -0.053781925
      agreeable: 0.04921357
      conscientiousness: 0.04811179
  # Income mode: 'continuous' (default, .dta-verified) or 'categorical'.
  income_mode: continuous
  # Categorical-income effects (doc rev 130826): score = intercept + level dummy
  # + personality part (income term dropped, remaining coefficients as above).
  # Level 1 (EUR 12) is the base level (intercept only); level_2..5 = EUR 32/72/128/200.
  categorical_income_effects:
    wtp:                       # doc rev 280826-2 section 3 cond() code
      intercept: -0.691843
      level_2: 0.2671588
      level_3: 0.5057716
      level_4: 0.9411747
      level_5: 1.822471
    risk_taking:
      intercept: -0.0068307
      level_2: 0.0026128
      level_3: 0.0050555
      level_4: 0.0092738
      level_5: 0.0179812
  # Segment s (1..5) receives the tail seq[s-1:] - the STATA direction (doc replace
  # statements + .dta choice1..5 columns, 280/280 for every mechanism): segment 1 gets the
  # full list starting with the top option, segment 5 only the last option. The doc prose
  # and the professor's 2026-08 feedback describe the mirror; per the 2026-09-04 rule the
  # Stata file arbitrates.
  priority_sequences:
    loyalty: [3, 1, 4, 5, 2]
    wtp: [3, 2, 1, 4, 5]
    risk_taking: [4, 2, 1, 3, 5]
    flexibility: [2, 4, 3, 1, 5]
  # Intercepts, doc notation: beta0 (TTP, on the composite), beta1 (loyalty, on the
  # standardized weighted_loyalty = std(bs)), beta2 (WTP, on the standardized score),
  # beta3 (risk_taking, on the standardized score), beta4 (flexibility, on the
  # standardized CALCULATED score before the 25/75 anchoring). Research defaults: TTP beta0 = 0.05 (professor,
  # 2026-08); the others 0 (doc placeholders 'XXX'). FIXED-CUTOFF semantics: the
  # segment cutoffs are anchored on the intercept-free population scores, so a
  # nonzero intercept shifts the score distribution AND the allocation across the
  # fixed segment boundaries (capped at the end bins); 0 reproduces the
  # intercept-free pipeline exactly.
  intercepts:
    ttp: 0.05
    loyalty: 0.0
    wtp: 0.0
    risk_taking: 0.0
    flexibility: 0.0
  z_scoring:                   # frozen original-280 mean/SD (Stata egen std semantics)
    ExtraversionBig5:
      mean: 3.557857
      sd: 0.6989565
    Agreeable:
      mean: 3.546071
      sd: 0.3732712
    NeuroticismBig5:
      mean: 2.702143
      sd: 0.6839657
    ConscientiousnessBig5:
      mean: 3.657143
      sd: 0.5596521
    OpennessBig5:
      mean: 4.060714
      sd: 0.5068274
    stdactions:                # observed flexibility: SD in actions per cycle (original 280)
      mean: 1.1863375902
      sd: 0.6752842665
  # sigma = (score range / 18) * mean(stdactions within allowance group); doc sigma tables.
  # NOTES: loyalty sigmas are on the STANDARDIZED weighted_loyalty scale (doc rev
  # 280826-2 table, factor 6.432015/18); risk_taking overall 0.332208167 = 5.979747/18 follows the doc as
  # stated even though it omits the *mean(stdactions) factor the other mechanisms use;
  # flexibility 0.4359172665 = (6.494119/18)*1.1863376 follows the doc's sigma table as
  # stated even though the doc quotes the z_anchored range as 6.6140623.
  stochastic:
    sigma_value: 0             # >0 enables draws in Research Specification mode
    in_copula: false           # enables draws in Copula mode
    mechanisms:
      ttp:
        sigma_strategy: overall
        sigma_overall: 0.395446
        sigma_quintile:
          '1': 0.3409411667
          '2': 0.3788993667
          '3': 0.4368824333
          '4': 0.4085647667
          '5': 0.4181633667
        scale_factor: 1.0
        quintile_scale_factors:
          '1': 1.0
          '2': 1.0
          '3': 1.0
          '4': 1.0
          '5': 1.0
        anchor: continuous     # weighted_ttp06 (doc line 191)
      loyalty:
        sigma_strategy: overall
        sigma_overall: 0.423918958
        sigma_quintile:        # 0.357334167 * mean(stdactions within allowance group), doc table
          '1': 0.3654897834
          '2': 0.4061810687
          '3': 0.4683390612
          '4': 0.4379824517
          '5': 0.448272175
        scale_factor: 1.0
        quintile_scale_factors:
          '1': 1.0
          '2': 1.0
          '3': 1.0
          '4': 1.0
          '5': 1.0
        anchor: continuous     # population z = std(bs_weighted_loyalty) ('binned' = doc-literal)
      wtp:
        sigma_strategy: overall
        sigma_overall: 0.45265807275
        sigma_quintile:
          '1': 0.390267757
          '2': 0.4337176628
          '3': 0.5000895873
          '4': 0.4676749852
          '5': 0.4786622888
        scale_factor: 1.0
        quintile_scale_factors:
          '1': 1.0
          '2': 1.0
          '3': 1.0
          '4': 1.0
          '5': 1.0
        anchor: continuous     # raw WTP_calculated (.dta-verified: NOT the binned score)
      risk_taking:
        sigma_strategy: overall
        sigma_overall: 0.332208167
        sigma_quintile:
          '1': 0.28639058
          '2': 0.318275468
          '3': 0.366981244
          '4': 0.343194404
          '5': 0.351257228
        scale_factor: 1.0
        quintile_scale_factors:
          '1': 1.0
          '2': 1.0
          '3': 1.0
          '4': 1.0
          '5': 1.0
        anchor: continuous     # population z of RT_calculated ('binned' = doc-literal)
      flexibility:
        sigma_strategy: overall
        sigma_overall: 0.4359172665
        sigma_quintile:        # 0.367448 * mean(stdactions within allowance group), doc table
          '1': 0.3758343529
          '2': 0.4176773361
          '3': 0.4815946054
          '4': 0.4503788034
          '5': 0.4609597598
        scale_factor: 1.0
        quintile_scale_factors:
          '1': 1.0
          '2': 1.0
          '3': 1.0
          '4': 1.0
          '5': 1.0
        anchor: continuous     # z_anchored_flexibility ('binned' = doc-literal Flexibility_combined15)
