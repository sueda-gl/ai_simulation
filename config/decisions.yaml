        scale_factor: 1.0
        quintile_scale_factors:
          '1': 1.0
          '2': 1.0
          '3': 1.0
          '4': 1.0
          '5': 1.0
        anchor: continuous     # weighted_ttp06 (doc line 191)
      loyalty:
        sigma_strategy: overall
        sigma_overall: 0.0318293523
        sigma_quintile:
          '1': 0.0274422808
